[project]
name = "redact"
version = "0.1.0"
description = "CLI tool for redacting sensitive information from PDF files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
redact = "redact.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redact"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]
